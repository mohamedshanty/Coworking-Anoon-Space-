<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شبكة noon</title>
<!--
  بوابة noonWiFi — ملف واحد، بلا build، بلا أي مورد خارجي.
  السبب: الجهاز لم يحصل على إنترنت بعد. أي خط أو سكربت من CDN سيفشل
  ما لم يُפתח في الـ walled garden. لذلك: خطوط النظام فقط، وكل شيء inline.
-->
<style>
  :root{
    --ink:#141A22;
    --ink-soft:#5A6472;
    --paper:#EEF1F4;
    --card:#FFFFFF;
    --line:#D5DCE3;
    --teal:#0E6E63;
    --teal-soft:#E3EFED;
    --amber:#B47A0A;
    --danger:#A32E28;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"SF Arabic","Segoe UI",system-ui,"Noto Naskh Arabic",Tahoma,sans-serif;
    background:var(--paper); color:var(--ink);
    line-height:1.6; min-height:100dvh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:24px 16px 40px;
  }
  .shell{width:100%;max-width:460px}

  /* ترويسة: حالة الشبكة كأول ما تراه العين */
  .head{padding:8px 4px 22px}
  .wordmark{font-size:15px;letter-spacing:.02em;color:var(--ink-soft)}
  .headline{font-size:29px;font-weight:650;line-height:1.25;margin-top:6px}
  .sub{margin-top:8px;color:var(--ink-soft);font-size:15px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel + .panel{margin-top:14px}
  .pad{padding:18px}

  label{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:7px}
  input{
    width:100%;padding:13px 14px;font-size:17px;font-family:inherit;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
  input.tel{direction:ltr;text-align:right;letter-spacing:.04em}
  .field + .field{margin-top:14px}

  /* اختيار السرعة: طول الشريط = عرض الحزمة. الشريط هو المعلومة نفسها. */
  .plans{border-top:1px solid var(--line)}
  .plan{
    display:block;width:100%;text-align:right;background:#fff;border:0;
    border-bottom:1px solid var(--line);padding:15px 18px;cursor:pointer;
    font-family:inherit;color:inherit;
  }
  .plan:last-child{border-bottom:0}
  .plan[aria-pressed="true"]{background:var(--teal-soft)}
  .plan-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .plan-speed{font-size:20px;font-weight:650}
  .plan-speed span{font-size:14px;font-weight:400;color:var(--ink-soft)}
  .plan-price{font-size:16px;font-weight:600;color:var(--amber);white-space:nowrap}
  .plan-price small{font-weight:400;color:var(--ink-soft)}
  .plan-hint{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
  .bar{height:5px;background:var(--line);border-radius:3px;margin-top:11px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--teal);border-radius:3px}

  .cta{
    width:100%;margin-top:16px;padding:16px;border:0;border-radius:12px;
    background:var(--teal);color:#fff;font-size:17px;font-weight:600;
    font-family:inherit;cursor:pointer;
  }
  .cta:disabled{background:#9AAAB2;cursor:default}
  .cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .note{margin-top:14px;font-size:13.5px;color:var(--ink-soft);text-align:center}
  .alert{
    margin-bottom:14px;padding:13px 15px;border-radius:11px;font-size:15px;
    background:#FBEAE9;color:var(--danger);border:1px solid #EFC9C6;
  }
  .warn{background:#FCF3DF;color:#7A5406;border-color:#EDDCB4}

  /* شاشة النجاح */
  .done-speed{font-size:56px;font-weight:680;line-height:1;letter-spacing:-.02em}
  .done-speed span{font-size:19px;font-weight:400;color:var(--ink-soft)}
  .rows{margin-top:20px;border-top:1px solid var(--line)}
  .row{display:flex;justify-content:space-between;gap:12px;
       padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row dt{color:var(--ink-soft)}
  .row dd{font-weight:600}

  .skel{height:15px;background:var(--line);border-radius:4px;animation:p 1.2s ease-in-out infinite}
  @keyframes p{50%{opacity:.45}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <div class="wordmark">مساحة noon</div>
    <h1 class="headline" id="headline">الاتصال بالشبكة</h1>
    <p class="sub" id="sub">لحظة، نتعرّف على جهازك…</p>
  </div>
  <div id="app">
    <div class="panel pad">
      <div class="skel" style="width:60%"></div>
      <div class="skel" style="width:85%;margin-top:12px"></div>
      <div class="skel" style="width:40%;margin-top:12px"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var API = ""; // نفس الأصل — البوابة تُخدَّم من خادم noonCowork

  var qs = new URLSearchParams(location.search);
  var MAC = qs.get("mac") || "";
  var IP  = qs.get("ip")  || "";
  var ORIG = qs.get("link-orig") || "https://www.google.com";
  var HOT_ERR = qs.get("error") || "";

  var app = document.getElementById("app");
  var headline = document.getElementById("headline");
  var sub = document.getElementById("sub");

  var ctx = null;
  var selected = null;
  var busy = false;

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function setHead(title, subtitle){
    headline.textContent = title;
    sub.textContent = subtitle || "";
    sub.style.display = subtitle ? "" : "none";
  }

  function alertBox(msg, kind){
    if (!msg) return "";
    return '<div class="alert' + (kind === "warn" ? " warn" : "") + '">' + esc(msg) + "</div>";
  }

  // ---------- جلب السياق ----------
  function boot(){
    if (!MAC) {
      setHead("تعذّر التعرّف على الجهاز", "");
      app.innerHTML = '<div class="panel pad">' +
        alertBox("افتح الشبكة من جديد، أو اطلب المساعدة من الاستقبال.") + "</div>";
      return;
    }
    fetch(API + "/api/v1/hotspot/context?mac=" + encodeURIComponent(MAC))
      .then(function (r) { return r.json(); })
      .then(function (data) { ctx = data; renderForm(); })
      .catch(function () {
        ctx = { known:false, choosable:true, plans:[
          {tier:"T10",label:"10 ميجا",mbps:10,hourlyRate:3,hint:"تصفّح وبريد"},
          {tier:"T20",label:"20 ميجا",mbps:20,hourlyRate:4,hint:"اجتماعات فيديو"},
          {tier:"T30",label:"30 ميجا",mbps:30,hourlyRate:5,hint:"بث وملفات كبيرة"}]};
        renderForm();
      });
  }

  // ---------- نموذج الدخول ----------
  function renderForm(){
    var known = ctx.known && ctx.phone;
    var needsName = !known || !ctx.name;

    setHead(
      known ? ("أهلاً " + ctx.name) : "الاتصال بالشبكة",
      known
        ? (ctx.choosable ? "اختر سرعتك وابدأ." : (ctx.note || "شبكتك جاهزة."))
        : "أدخل بياناتك مرة واحدة، وسنتذكّر جهازك في الزيارات القادمة."
    );

    var html = "";
    if (HOT_ERR) html += alertBox(HOT_ERR);
    if (ctx.needsRenewal) html += alertBox("اشتراكك منتهٍ. سيعمل الإنترنت اليوم، لكن راجع الاستقبال للتجديد.", "warn");

    // بيانات الشخص
    html += '<div class="panel pad">';
    if (known) {
      html += '<div class="row" style="border-top:0;padding-top:0">' +
                '<dt>الرقم</dt><dd dir="ltr">' + esc(ctx.phone) + "</dd></div>" +
              '<div class="row" style="border-bottom:0">' +
                "<dt>الحساب</dt><dd>" + esc(kindLabel(ctx.kind)) + "</dd></div>" +
              '<input type="hidden" id="phone" value="' + esc(ctx.phone) + '">';
    } else {
      html += '<div class="field"><label for="name">الاسم</label>' +
              '<input id="name" autocomplete="name" placeholder="الاسم الثنائي"></div>' +
              '<div class="field"><label for="phone">رقم الجوال</label>' +
              '<input id="phone" class="tel" inputmode="tel" autocomplete="tel" placeholder="0599000000"></div>';
    }
    html += "</div>";

    // السرعات
    if (ctx.choosable !== false) {
      html += '<div class="panel"><div class="pad" style="padding-bottom:12px">' +
              '<strong style="font-size:16px">اختر السرعة</strong>' +
              '<div class="plan-hint">تُحتسب بالساعة وتُضاف على حسابك عند الخروج.</div>' +
              '</div><div class="plans">';
      var max = 30;
      ctx.plans.forEach(function (p) {
        var isSel = selected === p.tier || (!selected && ctx.lastTier === p.tier);
        if (isSel) selected = p.tier;
        html += '<button type="button" class="plan" data-tier="' + p.tier + '" aria-pressed="' + (isSel ? "true" : "false") + '">' +
                  '<div class="plan-top">' +
                    '<div class="plan-speed">' + p.mbps + ' <span>ميجا</span></div>' +
                    '<div class="plan-price">' + p.hourlyRate + ' ₪ <small>/ ساعة</small></div>' +
                  "</div>" +
                  '<div class="plan-hint">' + esc(p.hint) + "</div>" +
                  '<div class="bar"><i style="width:' + Math.round((p.mbps / max) * 100) + '%"></i></div>' +
                "</button>";
      });
      html += "</div></div>";
      if (!selected && ctx.plans.length) selected = ctx.plans[0].tier;
    } else {
      var p0 = ctx.plans[0];
      html += '<div class="panel pad"><div class="plan-top">' +
                '<div class="plan-speed">' + p0.mbps + ' <span>ميجا</span></div>' +
                '<div class="plan-price" style="color:var(--teal)">مجاناً</div>' +
              '</div><div class="plan-hint">' + esc(p0.hint) + '</div>' +
              '<div class="bar"><i style="width:100%"></i></div></div>';
      selected = p0.tier;
    }

    html += '<button class="cta" id="go">اتصال</button>' +
            '<p class="note">بالاتصال، يتم تسجيل حضورك في المساحة تلقائياً.</p>';

    app.innerHTML = html;

    Array.prototype.forEach.call(app.querySelectorAll(".plan"), function (btn) {
      btn.addEventListener("click", function () {
        selected = btn.getAttribute("data-tier");
        Array.prototype.forEach.call(app.querySelectorAll(".plan"), function (b) {
          b.setAttribute("aria-pressed", b === btn ? "true" : "false");
        });
      });
    });
    document.getElementById("go").addEventListener("click", submit);
  }

  function kindLabel(k){
    return { subscriber:"مشترك", trainee:"متدرّب", employee:"موظف", visitor:"زائر" }[k] || "زائر";
  }

  // ---------- الإرسال ----------
  function submit(){
    if (busy) return;
    var nameEl = document.getElementById("name");
    var phoneEl = document.getElementById("phone");
    var name = nameEl ? nameEl.value.trim() : (ctx.name || "");
    var phone = (phoneEl.value || "").trim();

    if (!/^0?5\d{8}$/.test(phone.replace(/\D/g, "").replace(/^97[02]/, "0"))) {
      return showInline("أدخل رقم جوال صحيح يبدأ بـ 05");
    }
    if (nameEl && name.length < 2) return showInline("أدخل اسمك");

    busy = true;
    var btn = document.getElementById("go");
    btn.disabled = true;
    btn.textContent = "جارٍ التوصيل…";

    fetch(API + "/api/v1/hotspot/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mac: MAC, ip: IP, phone: phone, name: name, tier: selected })
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        busy = false;
        if (!res.ok) {
          btn.disabled = false; btn.textContent = "اتصال";
          return showInline(res.body.error || "تعذّر الاتصال. حاول مرة أخرى.");
        }
        renderDone(res.body);
      })
      .catch(function () {
        busy = false;
        btn.disabled = false; btn.textContent = "اتصال";
        showInline("انقطع الاتصال بالخادم. حاول مرة أخرى.");
      });
  }

  function showInline(msg){
    var old = app.querySelector(".alert");
    if (old) old.remove();
    app.insertAdjacentHTML("afterbegin", alertBox(msg));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- النجاح ----------
  function renderDone(r){
    setHead("تم الاتصال", "حضورك مسجَّل في المساحة.");
    var free = !r.hourlyRate;
    var html = '<div class="panel pad">' +
      '<div class="done-speed">' + r.mbps + ' <span>ميجا</span></div>' +
      '<dl class="rows">' +
        '<div class="row"><dt>الاسم</dt><dd>' + esc(r.name) + "</dd></div>" +
        '<div class="row"><dt>الحساب</dt><dd>' + esc(kindLabel(r.kind)) + "</dd></div>" +
        '<div class="row"><dt>التكلفة</dt><dd>' +
          (free ? "ضمن اشتراكك" : r.hourlyRate + " ₪ لكل ساعة") + "</dd></div>" +
      "</dl>";
    if (r.extraDevicesAuthorized > 0) {
      html += '<p class="note" style="text-align:right;margin-top:14px">' +
              "وصّلنا أيضاً " + r.extraDevicesAuthorized + " من أجهزتك الأخرى المتصلة.</p>";
    }
    if (!free) {
      html += '<p class="note" style="text-align:right">تتوقف المحاسبة عند إنهاء جلستك في الاستقبال، ' +
              "أو تلقائياً عند إغلاق المساحة.</p>";
    }
    html += "</div>" +
      '<button class="cta" id="browse">ابدأ التصفّح</button>';
    app.innerHTML = html;
    document.getElementById("browse").addEventListener("click", function () {
      location.href = ORIG;
    });
    setTimeout(function () { location.href = ORIG; }, 6000);
  }

  boot();
})();
</script>
</body>
</html>
